services:
  quarto:
    build:
      context: .
    working_dir: /work
    volumes:
      - ./:/work
      - renv-cache:/opt/renv/cache
    ports:
      - "4200:4200"
    # The base image defines an entrypoint; clear it for both preview and render.
    entrypoint: []
    command: ["quarto", "preview", "--host", "0.0.0.0", "--port", "4200"]

volumes:
  renv-cache:
